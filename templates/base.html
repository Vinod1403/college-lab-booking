
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LabBook{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">
                LabBook
            </a>
            <div class="navbar-nav ms-auto">
                
<a class="nav-link" href="{{ url_for('home') }}">Home</a>
<a class="nav-link" href="{{ url_for('equipment') }}">Equipment</a>
<a class="nav-link" href="{{ url_for('login') }}">Login</a>
<a class="nav-link" href="{{ url_for('register') }}">Register</a>
{% if session.get('user_id') %}
<a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a>
{% if session.get('user_id') %}
<a class="nav-link" href="{{ url_for('my_bookings') }}">My Bookings</a>
{% endif %}
{% endif %}

            </div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-secondary py-4 mt-5">
        College Lab Equipment Booking System
    </footer>
</body>
</html>
